name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 冒烟测试只依赖标准库（tools 不 import mcp），无需安装依赖
      - name: Run smoke tests
        run: python -m pytest tests/test_smoke.py -v
